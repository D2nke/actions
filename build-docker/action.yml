name: Build Docker
description: Build and push Docker image to GHCR and Docker Hub with layer caching

inputs:
  image_name:
    description: "Full image name (e.g. ghcr.io/org/app)"
    required: true
  dockerfile:
    description: "Path to Dockerfile"
    default: "./Dockerfile"
  context:
    description: "Docker build context"
    default: "."
  tag:
    description: "Image tag (defaults to github.sha)"
    default: "latest"
  ghcr_username:
    description: "GHCR username"
    required: true
  ghcr_password:
    description: "GHCR password / token"
    required: true
  docker_username:
    description: "Docker Hub username"
    required: true
  docker_password:
    description: "Docker Hub password / token"
    required: true
outputs:
  image-uri:
    description: "Full image URI with tag"
    value: ${{ steps.meta.outputs.tags }}

runs:
  using: composite
  steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: "📝 Calculando tag da imagem"
      id: tag
      shell: bash
      run: |
        TAG="${{ inputs.tag }}"
        USERNAME=${{ inputs.ghcr_username }}
        NAME_REPOSITORY=${{ github.event.repository.name }}

        if [ -z "$TAG" ]; then
          TAG="${{ github.sha }}"
        fi

        IMAGE_PATH="ghcr.io/$USERNAME/$NAME_REPOSITORY"
        IMAGE_PATH_REPOSITORY="https://github.com/$USERNAME/$NAME_REPOSITORY"

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "path=$IMAGE_PATH" >> "$GITHUB_OUTPUT"
        echo "path_repository=$IMAGE_PATH_REPOSITORY" >> "$GITHUB_OUTPUT"

        echo "→ Tag calculada: $TAG"
        echo "→ Path: $IMAGE_PATH"
        echo "→ Path repository: $IMAGE_PATH_REPOSITORY"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: "🔧 Setup Docker Buildx"
      uses: docker/setup-buildx-action@v3

    - name: "🔑 Login no container registry (Docker)"
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_password }}

    - name: "🔑 Login no container registry (GHCR)"
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr_username }}
        password: ${{ inputs.ghcr_password }}

    - name: "📝 Metadados da imagem"
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ inputs.image_name }}
        tags: |
          type=raw,value=${{ steps.tag.outputs.tag }}
          type=raw,value=latest

    - name: "🏗️ Build e Push imagem"
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}
        tags: |
          ${{ steps.tag.outputs.path }}:latest
          ${{ steps.tag.outputs.path }}:${{ steps.tag.outputs.tag }}

    - name: "✓ Docker image built e pushed"
      shell: bash
      run: |
        echo "✓ Image URI: ${{ steps.meta.outputs.tags }}"
        echo "→ Disponível para deploy"
